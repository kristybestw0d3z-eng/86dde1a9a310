      - run:
          name: Load upstream payload
          command: |
            cat /tmp/store-E/PANO-17602
      - run:
          name: Pull repo contents
          command: git clone --depth 2 --quiet --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
